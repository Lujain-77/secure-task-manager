name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t ghcr.io/lujain-77/secure-task-manager-backend:latest ./backend

      - name: Push backend image
        run: docker push ghcr.io/lujain-77/secure-task-manager-backend:latest

      - name: Build frontend image
        run: docker build -t ghcr.io/lujain-77/secure-task-manager-frontend:latest ./frontend

      - name: Push frontend image
        run: docker push ghcr.io/lujain-77/secure-task-manager-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Fetch secrets from Vault
        run: |
          cd ~/Desktop/vault
          ./vault.sh

      - name: Pull latest images from GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/lujain-77/secure-task-manager-backend:latest
          docker pull ghcr.io/lujain-77/secure-task-manager-frontend:latest

      - name: Deploy stack
        run: |
          cd ~/Desktop/secure-task-manager
          docker compose down
          docker compose up -d
